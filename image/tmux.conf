set -g history-limit 50000
set -g mouse on
set -g default-terminal "screen-256color"
set -g status-left "[#(jq -r .name ~/.pmva/session.json 2>/dev/null)] "
set -g status-left-length 40
set -g status-right "%H:%M UTC"
setw -g aggressive-resize on
set -g focus-events on
# 手元の端末で代替画面を使わない。Windows Terminal などの ConPTY の端末は、代替画面に切り替えた直後の
# 端末の種類の問い合わせに応答を 2 回返すことがあり、2 回目が mvm ssh のシェルに入力として流れていた
# (プロンプトに `61;4;6;7;...c0;10;1c` が入る)。抜けた後は tmux の最後の画面が端末に残る
set -as terminal-overrides ',*:smcup@:rmcup@'
