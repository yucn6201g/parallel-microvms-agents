name: CI

on:
  # プルリクエストのブランチは pull_request で走るので、push では main だけを対象にする (同じコミットで 2 回走らせない)
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同じブランチに続けて push したら、古い実行は止める
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    # 手元 PC で使う mvm を Windows / macOS / Linux それぞれで確かめる (AWS は使わない)
    name: test (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # テストが止まっても既定の 6 時間待たないように (普段は 2 分ほどで終わる)
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        # 3.9 は macOS 標準の Python (Xcode Command Line Tools)。Ubuntu の GitHub ランナーには 3.9 が無いので除く
        python: ["3.9", "3.13"]
        exclude:
          - os: ubuntu-latest
            python: "3.9"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install tmux and jq (MicroVM 側スクリプトの結合テスト用)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - name: Unit and CLI tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install cfn-lint
        run: pip install cfn-lint
      - name: shellcheck
        run: shellcheck -S warning bin/mvm scripts/install.sh image/bootstrap.sh image/snapshot.sh image/notify.sh image/agent-attach
      - name: cfn-lint
        run: cfn-lint infra/cloudformation.yaml infra/cloudformation-minimal.yaml
      - name: Compile Python
        run: python -m py_compile bin/mvm.py image/supervisor.py scripts/estimate_cost.py tests/*.py

  agents-e2e:
    # 本物の Claude Code / Codex (image/Dockerfile で固定した版) を LLM API の代わり (tests/mock_llm.py) につないで、
    # フックによる状態の記録 (mvm wait) と、会話記録の読み取り (mvm follow / result) を確かめる。MicroVM と AWS は使わない
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install tmux and jq
        run: sudo apt-get update && sudo apt-get install -y tmux jq
      - name: Install the pinned Claude Code and Codex
        run: |
          claude=$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' image/Dockerfile)
          codex=$(sed -n 's/^ARG CODEX_VERSION=//p' image/Dockerfile)
          npm install --no-audit --no-fund --prefix "$RUNNER_TEMP/agents" "@anthropic-ai/claude-code@$claude" "@openai/codex@$codex"
          bin="$RUNNER_TEMP/agents/node_modules/.bin"
          "$bin/claude" --version
          "$bin/codex" --version
          echo "PMVA_E2E_CLAUDE=$bin/claude" >> "$GITHUB_ENV"
          echo "PMVA_E2E_CODEX=$bin/codex" >> "$GITHUB_ENV"
      - name: Agent end-to-end tests
        run: python -m unittest tests.test_agents_e2e -v
