AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  parallel-microvms-agents - Lambda MicroVMs 上で Claude Code / Codex を並列実行するための共通リソース
  (イメージ資材/ワークスペース保存用 S3、ビルドロール、実行ロール、ログ、ローカル操作用ポリシー)

Parameters:
  Prefix:
    Type: String
    Default: pmva
    AllowedPattern: "[a-z0-9-]+"
    Description: リソース名と Secrets Manager のシークレット名に付けるプレフィックス
  EnableBedrock:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: 実行ロールに Amazon Bedrock の呼び出し権限を付与するか (Claude Code の Bedrock 認証で使用)
  WorkspaceSnapshotRetentionDays:
    Type: Number
    Default: 7
    MinValue: 1
    Description: ワークスペーススナップショット履歴 (workspace-history/) の保持日数。workspaces/<name>/latest は対象外
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 120, 150, 180, 365]
  BudgetMonthlyUsd:
    Type: Number
    Default: 0
    MinValue: 0
    Description: 月額の予算 (USD)。0 なら予算アラートを作らない。対象はアカウント全体の費用
  BudgetEmail:
    Type: String
    Default: ""
    Description: 予算アラートの通知先メールアドレス
  KeepaliveRateMinutes:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 60
    Description: 作業中の MicroVM を起こし続ける定期処理の間隔 (分)。0 で無効。IDLE_MAX_SECONDS より短くする
  KeepaliveActiveSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    Description: 最後の作業 (画面の変化や CPU 使用) からこの秒数以内なら作業中とみなして起こし続ける

  NightlyStopCron:
    Type: String
    Default: ""
    Description: 'すべての MicroVM を保存して終了する時刻 (EventBridge Scheduler の cron 式。例: "cron(0 23 * * ? *)")。空なら作らない'
  NightlyStopTimezone:
    Type: String
    Default: Asia/Tokyo
    Description: NightlyStopCron のタイムゾーン
  ImageName:
    Type: String
    Default: pmva-agent
    Description: 夜間の自動停止の対象にする MicroVM イメージ名

Conditions:
  BedrockEnabled: !Equals [!Ref EnableBedrock, "true"]
  NightlyStopEnabled: !Not [!Equals [!Ref NightlyStopCron, ""]]
  BudgetEnabled: !And
    - !Not [!Equals [!Ref BudgetMonthlyUsd, 0]]
    - !Not [!Equals [!Ref BudgetEmail, ""]]
  KeepaliveEnabled: !Not [!Equals [!Ref KeepaliveRateMinutes, 0]]
  KeepaliveEveryMinute: !Equals [!Ref KeepaliveRateMinutes, 1]

Resources:
  ArtifactBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${Prefix}-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      LifecycleConfiguration:
        Rules:
          - Id: expire-workspace-snapshot-history
            Status: Enabled
            Prefix: workspace-history/
            ExpirationInDays: !Ref WorkspaceSnapshotRetentionDays
          - Id: expire-stale-status
            Status: Enabled
            Prefix: status/
            ExpirationInDays: 2
          - Id: expire-old-image-artifacts
            Status: Enabled
            Prefix: images/
            ExpirationInDays: 30

  ArtifactBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArtifactBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  MicrovmLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda-microvms/${Prefix}"
      RetentionInDays: !Ref LogRetentionDays

  # イメージビルド時に Lambda が引き受けるロール (S3 の資材読み取りとビルドログのみ)
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-microvm-build"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCodeArtifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/images/*"
              - Sid: WriteBuildLogs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"

  # 実行中の MicroVM が IMDSv2 経由で引き受けるロール。
  # VM 内のエージェントが自分の使わない認証情報を読めないよう、使うエージェントごとにロールを分ける
  # (mvm up が --agent / 認証方式に合わせて選ぶ)。シークレットは名前の接頭辞で区別する:
  #   Claude: <prefix>/anthropic-*, <prefix>/claude-*   Codex: <prefix>/openai-*, <prefix>/codex-*
  #   共通:   <prefix>/github-*, <prefix>/notify-*
  RuntimePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Prefix}-microvm-runtime"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Logs
            Effect: Allow
            Action:
              - logs:CreateLogGroup
              - logs:CreateLogStream
              - logs:PutLogEvents
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"
          - Sid: CommonSecrets
            Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource:
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/github-*"
              - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/notify-*"
          - Sid: WorkspaceSnapshots
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
            Resource:
              - !Sub "${ArtifactBucket.Arn}/workspaces/*"
              - !Sub "${ArtifactBucket.Arn}/workspace-history/*"
              - !Sub "${ArtifactBucket.Arn}/status/*"
          - Sid: ListWorkspaceSnapshots
            Effect: Allow
            Action: s3:ListBucket
            Resource: !GetAtt ArtifactBucket.Arn
            Condition:
              StringLike:
                s3:prefix:
                  - "workspaces/*"
                  - "workspace-history/*"

  # Claude Code と Codex の両方
  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-microvm-execution"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: agent-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/anthropic-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/claude-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/openai-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/codex-*"
      ManagedPolicyArns: !If
        - BedrockEnabled
        - [!Ref RuntimePolicy, !Ref BedrockInvokePolicy]
        - [!Ref RuntimePolicy]

  ExecutionRoleClaude:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-microvm-execution-claude"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: claude-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/anthropic-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/claude-*"
      ManagedPolicyArns: !If
        - BedrockEnabled
        - [!Ref RuntimePolicy, !Ref BedrockInvokePolicy]
        - [!Ref RuntimePolicy]

  ExecutionRoleCodex:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-microvm-execution-codex"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: codex-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/openai-*"
                  - !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/codex-*"
      ManagedPolicyArns:
        - !Ref RuntimePolicy

  # エージェントなし (--agent none)
  ExecutionRoleNone:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${Prefix}-microvm-execution-none"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      ManagedPolicyArns:
        - !Ref RuntimePolicy

  BedrockInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Condition: BedrockEnabled
    Properties:
      ManagedPolicyName: !Sub "${Prefix}-bedrock-invoke"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeClaudeOnBedrock
            Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:ListInferenceProfiles
              - bedrock:GetInferenceProfile
              - bedrock:ListFoundationModels
            Resource: "*"

  # ローカル PC で mvm を実行する IAM ユーザー / ロールにアタッチするポリシー
  OperatorPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub "${Prefix}-operator"
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: ManageMicrovms
            Effect: Allow
            Action:
              - lambda:*Microvm*
              - lambda:ListTags
              - lambda:TagResource
              - lambda:UntagResource
            Resource: "*"
          - Sid: PassManagedNetworkConnectors
            Effect: Allow
            Action: lambda:PassNetworkConnector
            Resource:
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:aws:network-connector:aws-network-connector:*"
              - !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:network-connector:*"
          - Sid: PassMicrovmRoles
            Effect: Allow
            Action: iam:PassRole
            Resource:
              - !GetAtt BuildRole.Arn
              - !GetAtt ExecutionRole.Arn
              - !GetAtt ExecutionRoleClaude.Arn
              - !GetAtt ExecutionRoleCodex.Arn
              - !GetAtt ExecutionRoleNone.Arn
            Condition:
              StringEquals:
                iam:PassedToService: lambda.amazonaws.com
          - Sid: Artifacts
            Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:ListBucket
            Resource:
              - !GetAtt ArtifactBucket.Arn
              - !Sub "${ArtifactBucket.Arn}/*"
          - Sid: ManageAgentSecrets
            Effect: Allow
            Action:
              - secretsmanager:CreateSecret
              - secretsmanager:PutSecretValue
              - secretsmanager:DescribeSecret
              - secretsmanager:DeleteSecret
              - secretsmanager:TagResource
            Resource: !Sub "arn:${AWS::Partition}:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:${Prefix}/*"
          - Sid: ListSecrets
            Effect: Allow
            Action: secretsmanager:ListSecrets
            Resource: "*"
          - Sid: ReadMicrovmQuota
            Effect: Allow
            Action: servicequotas:GetServiceQuota
            Resource: "*"
          - Sid: ReadLogs
            Effect: Allow
            Action:
              - logs:DescribeLogStreams
              - logs:GetLogEvents
              - logs:FilterLogEvents
              - logs:StartLiveTail
            Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda-microvms/*"
          - Sid: ReadStack
            Effect: Allow
            Action: cloudformation:DescribeStacks
            Resource: !Sub "arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*"

  # ---- 作業中の MicroVM を起こし続ける定期処理 (手元 PC を閉じても作業が止まらないようにする)
  # MicroVM のアイドル判定はエンドポイントへの受信通信だけを見る。VM 内の supervisor.py が
  # 最後の作業時刻を status/<name>.json に書き、ここで作業中の VM にだけ /healthz を送る。
  KeepaliveRole:
    Type: AWS::IAM::Role
    Condition: KeepaliveEnabled
    Properties:
      RoleName: !Sub "${Prefix}-keepalive"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: keepalive
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt ArtifactBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: "status/*"
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub "${ArtifactBucket.Arn}/status/*"
              - Effect: Allow
                Action:
                  - lambda:GetMicrovm
                  - lambda:CreateMicrovmAuthToken
                Resource: "*"

  KeepaliveFunction:
    Type: AWS::Lambda::Function
    Condition: KeepaliveEnabled
    DependsOn: KeepaliveLogGroup
    Properties:
      FunctionName: !Sub "${Prefix}-keepalive"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 120
      MemorySize: 128
      Role: !GetAtt KeepaliveRole.Arn
      Environment:
        Variables:
          BUCKET: !Ref ArtifactBucket
          ACTIVE_SECONDS: !Ref KeepaliveActiveSeconds
      Code:
        ZipFile: |
          import json, os, time, urllib.request
          import boto3, botocore.session
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          R = os.environ["AWS_REGION"]
          B = os.environ["BUCKET"]
          W = int(os.environ["ACTIVE_SECONDS"])
          s3 = boto3.client("s3")

          def api(method, path, body=None):
              # boto3 の対応状況に左右されないよう、MicroVMs の REST API を直接署名して呼ぶ
              url = f"https://lambda.{R}.amazonaws.com/2025-09-09/microvms/{path}"
              data = json.dumps(body) if body is not None else None
              req = AWSRequest(method=method, url=url, data=data,
                               headers={"Content-Type": "application/json"} if data else {})
              cred = botocore.session.Session().get_credentials().get_frozen_credentials()
              SigV4Auth(cred, "lambda", R).add_auth(req)
              r = urllib.request.Request(url, data=data.encode() if data else None,
                                         method=method, headers=dict(req.headers))
              with urllib.request.urlopen(r, timeout=15) as f:
                  return json.loads(f.read() or b"{}")

          def handler(event, context):
              now, pinged, skipped = time.time(), [], []
              pages = s3.get_paginator("list_objects_v2").paginate(Bucket=B, Prefix="status/")
              for o in [o for p in pages for o in p.get("Contents", [])]:
                  try:
                      st = json.loads(s3.get_object(Bucket=B, Key=o["Key"])["Body"].read())
                      # 状態が古い (= 一時停止・終了済み) か、しばらく作業していなければ何もしない
                      if now - st["updatedAt"] > 600 or now - st["lastActivity"] > W:
                          skipped.append(st.get("name"))
                          continue
                      vm = api("GET", st["microvmId"])
                      if vm.get("state") != "RUNNING":
                          continue
                      tok = api("POST", st["microvmId"] + "/auth-token",
                                {"expirationInMinutes": 5, "allowedPorts": [{"port": 8080}]})
                      host = vm["endpoint"].split("://")[-1].rstrip("/")
                      req = urllib.request.Request(f"https://{host}/healthz", headers={
                          "X-aws-proxy-auth": tok["authToken"]["X-aws-proxy-auth"],
                          "X-aws-proxy-port": "8080"})
                      urllib.request.urlopen(req, timeout=15).read()
                      pinged.append(st.get("name"))
                  except Exception as e:
                      print(f"error {o['Key']}: {e!r}")
              print(json.dumps({"pinged": pinged, "idle": skipped}))
              return {"pinged": pinged}

  KeepaliveLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: KeepaliveEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Prefix}-keepalive"
      RetentionInDays: !Ref LogRetentionDays

  KeepaliveSchedule:
    Type: AWS::Events::Rule
    Condition: KeepaliveEnabled
    Properties:
      Name: !Sub "${Prefix}-keepalive"
      ScheduleExpression: !If
        - KeepaliveEveryMinute
        - "rate(1 minute)"
        - !Sub "rate(${KeepaliveRateMinutes} minutes)"
      Targets:
        - Id: keepalive
          Arn: !GetAtt KeepaliveFunction.Arn

  KeepalivePermission:
    Type: AWS::Lambda::Permission
    Condition: KeepaliveEnabled
    Properties:
      FunctionName: !Ref KeepaliveFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt KeepaliveSchedule.Arn

  # ---- 夜間の自動停止 (止め忘れ防止)。このイメージから起動した MicroVM をすべて保存してから終了する
  NightlyStopRole:
    Type: AWS::IAM::Role
    Condition: NightlyStopEnabled
    Properties:
      RoleName: !Sub "${Prefix}-nightly-stop"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
      Policies:
        - PolicyName: nightly-stop
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - lambda:ListMicrovms
                  - lambda:GetMicrovm
                  - lambda:CreateMicrovmAuthToken
                  - lambda:TerminateMicrovm
                Resource: "*"

  NightlyStopLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: NightlyStopEnabled
    Properties:
      LogGroupName: !Sub "/aws/lambda/${Prefix}-nightly-stop"
      RetentionInDays: !Ref LogRetentionDays

  NightlyStopFunction:
    Type: AWS::Lambda::Function
    Condition: NightlyStopEnabled
    DependsOn: NightlyStopLogGroup
    Properties:
      FunctionName: !Sub "${Prefix}-nightly-stop"
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Timeout: 900
      MemorySize: 128
      Role: !GetAtt NightlyStopRole.Arn
      Environment:
        Variables:
          IMAGE_ARN: !Sub "arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:microvm-image:${ImageName}"
      Code:
        ZipFile: |
          import json, os, urllib.parse, urllib.request
          import botocore.session
          from botocore.auth import SigV4Auth
          from botocore.awsrequest import AWSRequest
          R = os.environ["AWS_REGION"]
          IMG = os.environ["IMAGE_ARN"]

          def api(method, path="", body=None, query=None):
              url = f"https://lambda.{R}.amazonaws.com/2025-09-09/microvms" + (f"/{path}" if path else "")
              if query:
                  url += "?" + urllib.parse.urlencode(query)
              data = json.dumps(body) if body is not None else None
              req = AWSRequest(method=method, url=url, data=data,
                               headers={"Content-Type": "application/json"} if data else {})
              cred = botocore.session.Session().get_credentials().get_frozen_credentials()
              SigV4Auth(cred, "lambda", R).add_auth(req)
              r = urllib.request.Request(url, data=data.encode() if data else None,
                                         method=method, headers=dict(req.headers))
              with urllib.request.urlopen(r, timeout=30) as f:
                  return json.loads(f.read() or b"{}")

          def handler(event, context):
              vms, token = [], None
              while True:
                  q = {"imageIdentifier": IMG, "maxResults": 50}
                  if token:
                      q["nextToken"] = token
                  page = api("GET", query=q)
                  vms += [v for v in page.get("items", []) if v["state"] in ("PENDING", "RUNNING", "SUSPENDED")]
                  token = page.get("nextToken")
                  if not token:
                      break
              stopped = []
              for v in vms:
                  vid = v["microvmId"]
                  try:
                      # 終了前にワークスペースを S3 に保存する (一時停止中なら自動で再開される)
                      host = api("GET", vid)["endpoint"].split("://")[-1].rstrip("/")
                      tok = api("POST", vid + "/auth-token",
                                {"expirationInMinutes": 15, "allowedPorts": [{"port": 8080}]})
                      req = urllib.request.Request(f"https://{host}/snapshot", data=b"{}", method="POST", headers={
                          "X-aws-proxy-auth": tok["authToken"]["X-aws-proxy-auth"],
                          "X-aws-proxy-port": "8080", "Content-Type": "application/json"})
                      urllib.request.urlopen(req, timeout=300).read()
                  except Exception as e:
                      print(f"save failed {vid}: {e!r} (terminate hook will try again)")
                  try:
                      api("DELETE", vid)
                      stopped.append(vid)
                  except Exception as e:
                      print(f"terminate failed {vid}: {e!r}")
              print(json.dumps({"stopped": stopped}))
              return {"stopped": stopped}

  NightlyStopSchedulerRole:
    Type: AWS::IAM::Role
    Condition: NightlyStopEnabled
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: invoke
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt NightlyStopFunction.Arn

  NightlyStopSchedule:
    Type: AWS::Scheduler::Schedule
    Condition: NightlyStopEnabled
    Properties:
      Name: !Sub "${Prefix}-nightly-stop"
      ScheduleExpression: !Ref NightlyStopCron
      ScheduleExpressionTimezone: !Ref NightlyStopTimezone
      FlexibleTimeWindow:
        Mode: "OFF"
      Target:
        Arn: !GetAtt NightlyStopFunction.Arn
        RoleArn: !GetAtt NightlyStopSchedulerRole.Arn

  # ---- 月額の予算アラート (任意)
  MonthlyBudget:
    Type: AWS::Budgets::Budget
    Condition: BudgetEnabled
    Properties:
      Budget:
        BudgetName: !Sub "${Prefix}-monthly"
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref BudgetMonthlyUsd
          Unit: USD
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            Threshold: 80
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref BudgetEmail

Outputs:
  ArtifactBucketName:
    Value: !Ref ArtifactBucket
  BuildRoleArn:
    Value: !GetAtt BuildRole.Arn
  ExecutionRoleArn:
    Value: !GetAtt ExecutionRole.Arn
  ExecutionRoleClaudeArn:
    Value: !GetAtt ExecutionRoleClaude.Arn
  ExecutionRoleCodexArn:
    Value: !GetAtt ExecutionRoleCodex.Arn
  ExecutionRoleNoneArn:
    Value: !GetAtt ExecutionRoleNone.Arn
  LogGroupName:
    Value: !Ref MicrovmLogGroup
  OperatorPolicyArn:
    Value: !Ref OperatorPolicy
  SecretPrefix:
    Value: !Sub "${Prefix}/"
